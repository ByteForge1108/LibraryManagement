<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        input {
            padding: 10px;
            width: 150px;
            margin: 10px;
        }

        #result {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Library Management System</h1>

    <button onclick="displayBooks()">Display Books</button>
    <button onclick="issueBook()">Issue Book</button>
    <button onclick="returnBook()">Return Book</button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
